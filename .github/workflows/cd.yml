name: CD - Deploy to Production

on:
  push:
    branches: ["production", "main"] 
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "8"
  REGISTRY: ghcr.io
  IMAGE_NAME: simo-2004/unimol-asd-frontend

jobs:
  # 1 Build and Push Docker Image
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          
          
          no-cache: true
          
          

          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_API_URL=http://167.99.143.43:8000/api

  # 2 Deploy to VPS
  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote ssh commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # 1. Login al registry
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 2. Ferma e rimuovi il vecchio container
            docker stop frontend-nextjs || true
            docker rm frontend-nextjs || true

            
            # Cancella l'immagine dal disco per forzare il download di quella nuova
            docker rmi -f ghcr.io/simo-2004/unimol-asd-frontend:latest || true

            # 4. Scarica la nuova versione
            docker pull ghcr.io/simo-2004/unimol-asd-frontend:latest

            # 5. Nuovo container
            docker run -d \
              --name frontend-nextjs \
              --restart unless-stopped \
              --network unimol-net \
              -p 3000:3000 \
              -e NODE_ENV=production \
              ghcr.io/simo-2004/unimol-asd-frontend:latest

  # 3 Crea la release
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
